name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Auto-detect changed packages, or override the selection
        type: choice
        default: auto
        options:
          - auto
          - selaras-and-docs
          - all
          - selaras
          - selaras-docs
          - selaras-mcp
      selaras-bump:
        description: Selaras bump (auto uses relevant conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      selaras-version:
        description: Exact Selaras version (must advance; overrides selaras-bump)
        required: false
        type: string
      docs-bump:
        description: Docs layer bump (auto uses relevant conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      docs-version:
        description: Exact docs layer version (must advance; overrides docs-bump)
        required: false
        type: string
      mcp-bump:
        description: MCP server bump (auto uses relevant conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      mcp-version:
        description: Exact MCP server version (must advance; overrides mcp-bump)
        required: false
        type: string

# A running publication must finish; a second run waits and then plans against
# the updated default branch instead of reusing an earlier version candidate.
concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release plan path
        run: echo "PLAN_FILE=$RUNNER_TEMP/selaras-release-plan.json" >> "$GITHUB_ENV"

      - name: Plan release
        id: plan
        env:
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/plan-release.mjs --output "$PLAN_FILE"

      - name: Save release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: ${{ env.PLAN_FILE }}

      - name: Docs prepare
        run: bun run docs:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Create release candidate
        if: steps.plan.outputs.has_packages == 'true'
        run: node scripts/apply-release-plan.mjs "$PLAN_FILE"

      - name: Install Chromium for release validation
        if: steps.plan.outputs.has_packages == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Verify release candidate
        if: steps.plan.outputs.has_packages == 'true'
        run: bun run test:release

      - name: Build
        if: steps.plan.outputs.has_packages == 'true'
        run: bun run prepack

      - name: Verify MCP server package
        if: steps.plan.outputs.mcp == 'true'
        run: bun run test:agent

      # Publishing remains before git finalization. Retried versions are accepted
      # only when publish-package verifies the already published artifact matches.
      - name: Configure npm trusted publishing
        if: steps.plan.outputs.has_packages == 'true'
        run: npm install -g npm@latest

      - name: Verify release branch has not advanced
        if: steps.plan.outputs.has_packages == 'true'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          git fetch origin "$RELEASE_REF"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Publish to npm
        if: steps.plan.outputs.selaras == 'true'
        run: node scripts/publish-package.mjs

      - name: Prepare docs layer publish manifest
        if: steps.plan.outputs.docs == 'true'
        run: node scripts/prepare-docs-layer-release.mjs && node scripts/prepare-docs-layer-release.mjs --assert-publishable

      - name: Verify published Selaras dependency
        if: steps.plan.outputs.docs == 'true' && steps.plan.outputs.selaras != 'true'
        run: node scripts/prepare-docs-layer-release.mjs --verify

      - name: Publish docs layer to npm
        if: steps.plan.outputs.docs == 'true'
        run: node scripts/publish-package.mjs packages/docs

      - name: Restore docs layer workspace dependency
        if: always() && steps.plan.outputs.docs == 'true'
        run: node scripts/prepare-docs-layer-release.mjs --restore

      - name: Publish MCP server to npm
        if: steps.plan.outputs.mcp == 'true'
        run: node scripts/publish-package.mjs packages/mcp

      - name: Configure git identity
        if: steps.plan.outputs.has_packages == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag the release
        if: steps.plan.outputs.has_packages == 'true'
        env:
          RELEASE_PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          read -r -a packages <<< "$RELEASE_PACKAGES"
          bash scripts/tag-and-push-release.sh "${packages[@]}"

      - name: Create GitHub release
        if: steps.plan.outputs.selaras == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.selaras_tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$PLAN_FILE.selaras.md"

      - name: Create docs layer GitHub release
        if: steps.plan.outputs.docs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.docs_tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$PLAN_FILE.docs.md"

      - name: Create MCP server GitHub release
        if: steps.plan.outputs.mcp == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.mcp_tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$PLAN_FILE.mcp.md"

  docs:
    needs: release
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The `release` job just pushed a version-bump commit - check out its
      # tip (not the older commit that triggered this workflow) so the
      # deployed docs reflect the version that was actually just released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: bun install

      - name: Docs prepare
        run: bun run docs:prepare

      # The custom domain serves the docs from its root. Keep generated
      # asset paths, canonical URLs and agent links on the same origin.
      - name: Generate static docs site
        run: |
          bun run docs:generate
          bun run test:docs-seo
        env:
          NUXT_APP_BASE_URL: /
          NUXT_SITE_URL: https://selarasui.my.id
          NUXT_LLMS_DOMAIN: https://selarasui.my.id

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
