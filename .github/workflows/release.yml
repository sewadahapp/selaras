name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (leave as auto to let changelogen infer it from commit types)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, see the Publish step below) needs npm CLI
      # >= 11.5.1 - not guaranteed to be what Node 24.19.0 happens to bundle.
      - run: npm install -g npm@latest

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: bun install

      - name: Playground prepare
        run: bun run dev:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run prepack

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bumps package.json, writes CHANGELOG.md, commits + tags, pushes, and
      # creates the GitHub release - all via the automatic GITHUB_TOKEN, no
      # extra secret needed for this step. `bump` defaults to "auto" (changelogen
      # infers patch/minor/major from commit types since the last tag,
      # matching this repo's own Conventional Commits history) - the workflow
      # input only overrides it when explicitly set to patch/minor/major.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx changelogen --release --push ${{ inputs.bump != 'auto' && format('--{0}', inputs.bump) || '' }}

      # BOOTSTRAP ONLY: npm wouldn't let a trusted publisher be configured
      # for "selaras" before it exists, so this first release still
      # authenticates with the NPM_TOKEN secret (an Automation token).
      # Once this release succeeds, go configure Trusted Publishers on the
      # package's own Settings page on npmjs.com (GitHub Actions -> org
      # "sewadahapp", repo "selaras", workflow filename "release.yml"),
      # then delete the `env:` block below and the NPM_TOKEN secret - the
      # `id-token: write` permission above is already in place for it.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  docs:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The `release` job just pushed a version-bump commit - check out its
      # tip (not the older commit that triggered this workflow) so the
      # deployed docs reflect the version that was actually just released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: bun install

      # A GitHub Pages *project* site (not a custom domain or a
      # <org>.github.io root repo) serves from a /selaras/ subpath, not the
      # domain root - NUXT_APP_BASE_URL is Nuxt's own env-var mapping for
      # runtimeConfig.app.baseURL, so every generated link/asset path
      # accounts for it. Left unset for local `bun run dev:generate`, which
      # still defaults to `/`.
      - name: Generate static docs site
        run: bun run dev:generate
        env:
          NUXT_APP_BASE_URL: /selaras/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
