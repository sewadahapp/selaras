name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to release
        type: choice
        default: both
        options:
          - both
          - selaras
          - selaras-docs
      selaras-bump:
        description: Selaras version bump (auto lets changelogen infer it from commit types)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      selaras-version:
        description: Exact Selaras version (for example 1.0.0; overrides selaras-bump)
        required: false
        type: string
      docs-bump:
        description: Docs layer version bump (auto resolves to patch)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      docs-version:
        description: Exact docs layer version (for example 0.2.0; overrides docs-bump)
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, see the Publish step below) needs npm CLI
      # >= 11.5.1 - not guaranteed to be what Node 24.19.0 happens to bundle.
      - run: npm install -g npm@latest

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: bun install

      - name: Docs prepare
        run: bun run docs:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Only bumps package.json and writes CHANGELOG.md - no commit, tag,
      # push, or GitHub release yet. Everything that mutates git/GitHub
      # happens *after* the npm publish step below now, not before - a
      # failed publish used to still leave a pushed bump commit, tag, and
      # GitHub release behind with nothing to undo them (found the hard
      # way: a 403 from npm still left v0.1.1 tagged and released on
      # GitHub). Publishing first means a failure here simply stops the
      # job - there's nothing to revert because nothing was pushed.
      # `selaras-bump` defaults to "auto" (changelogen infers patch/minor/
      # major from commit types since the last tag). `selaras-version` is an
      # exact override: SemVer's pre-1.0 major bump turns 0.1.1 into 0.2.0,
      # while the first stable release must explicitly request 1.0.0.
      - name: Bump Selaras version
        if: inputs.package != 'selaras-docs'
        env:
          RELEASE_BUMP: ${{ inputs.selaras-bump }}
          RELEASE_VERSION: ${{ inputs.selaras-version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            npx changelogen --bump -r "$RELEASE_VERSION"
          elif [ "$RELEASE_BUMP" = "auto" ]; then
            npx changelogen --bump
          else
            npx changelogen --bump "--$RELEASE_BUMP"
          fi

      # Changelogen preserves the complete commit history. The first stable
      # release adds a short user-facing upgrade summary ahead of it; the
      # release body below is read from this same generated entry.
      - name: Add 1.0 migration summary
        if: inputs.package != 'selaras-docs' && inputs.selaras-version == '1.0.0'
        run: node scripts/annotate-release-notes.mjs 1.0.0 .github/release-notes/1.0.0.md

      # The docs layer is an independent release stream with its own version
      # - this never copies the core version over. `docs-bump` defaults to
      # `auto`, which resolves to a patch bump; anything beyond that (or an
      # exact `docs-version`) needs an explicit bump, since changelogen's
      # commit-type inference tracks the core stream. Each package in a joint
      # run uses its own inputs, so mixed levels (Selaras major alongside a
      # docs patch, for example) release together in one run.
      - name: Bump docs layer version
        if: inputs.package != 'selaras'
        env:
          RELEASE_BUMP: ${{ inputs.docs-bump }}
          RELEASE_VERSION: ${{ inputs.docs-version }}
        run: node scripts/bump-docs-layer.mjs

      # Validate the versioned release candidate itself, including generated
      # declarations, a fresh packed install, and Chromium hydration/portal
      # behavior. CI's matrix remains broader; this is the publish-critical
      # slice that must finish before npm can receive the artifact.
      - name: Install Chromium for release validation
        run: bunx playwright install --with-deps chromium

      - name: Verify release candidate
        run: bun run test:release

      - name: Build
        if: inputs.package != 'selaras-docs'
        run: bun run prepack

      # BOOTSTRAP ONLY: npm wouldn't let a trusted publisher be configured
      # for "selaras" before it exists, so this first release still
      # authenticates with the NPM_TOKEN secret (an Automation token).
      # Once this release succeeds, go configure Trusted Publishers on the
      # package's own Settings page on npmjs.com (GitHub Actions -> org
      # "sewadahapp", repo "selaras", workflow filename "release.yml"),
      # then delete the `env:` block below and the NPM_TOKEN secret - the
      # `id-token: write` permission above is already in place for it.
      - name: Publish to npm
        if: inputs.package != 'selaras-docs'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # The docs layer depends on the core package through `file:../..` for
      # local development - npm cannot publish that, so rewrite the
      # dependency to the just-published core range right before publishing.
      # The layer keeps its own version throughout; restore the workspace
      # dependency afterwards so the working tree stays developable.
      - name: Prepare docs layer publish manifest
        if: inputs.package != 'selaras'
        run: node scripts/prepare-docs-layer-release.mjs && node scripts/prepare-docs-layer-release.mjs --assert-publishable

      # A docs-only release publishes against a core version from an earlier
      # run - confirm that range actually exists on the registry before
      # shipping an uninstallable package. Skipped for joint releases, where
      # the core version was published a few steps earlier in this same job.
      - name: Verify published Selaras dependency
        if: inputs.package == 'selaras-docs'
        run: node scripts/prepare-docs-layer-release.mjs --verify

      - name: Publish docs layer to npm
        if: inputs.package != 'selaras'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd packages/docs && npm publish --access public

      - name: Restore docs layer workspace dependency
        if: inputs.package != 'selaras' && always()
        run: node scripts/prepare-docs-layer-release.mjs --restore

      # Only reached once the publish above has actually succeeded - now
      # it's safe to commit the version bump(s), tag, and push. Same
      # script the local `release:*` scripts use, so there's one place
      # that defines this instead of two copies to keep in sync. Each
      # package gets its own tag (selaras-v0.3.0, selaras-docs-v0.1.1);
      # core releases additionally keep the legacy v0.3.0 tag so
      # changelogen's bump inference keeps working.
      - name: Commit and tag the release
        run: |
          if [ "${{ inputs.package }}" = "both" ]; then
            bash scripts/tag-and-push-release.sh selaras selaras-docs
          elif [ "${{ inputs.package }}" = "selaras-docs" ]; then
            bash scripts/tag-and-push-release.sh selaras-docs
          else
            bash scripts/tag-and-push-release.sh selaras
          fi

      # Reads the entry `Bump Selaras version` just wrote into CHANGELOG.md
      # and creates the matching GitHub release from it - no recomputation of
      # commits/version, so this can't drift from what was actually
      # published above.
      - name: Create GitHub release
        if: inputs.package != 'selaras-docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx changelogen gh release

      # The docs layer has no CHANGELOG entry of its own - generate the
      # release notes from the commits since the previous docs tag instead.
      - name: Create docs layer GitHub release
        if: inputs.package != 'selaras'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "selaras-docs-v$(node -p "require('./packages/docs/package.json').version")" --title "selaras-docs v$(node -p "require('./packages/docs/package.json').version")" --generate-notes

  docs:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The `release` job just pushed a version-bump commit - check out its
      # tip (not the older commit that triggered this workflow) so the
      # deployed docs reflect the version that was actually just released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: bun install

      - name: Docs prepare
        run: bun run docs:prepare

      # A GitHub Pages *project* site (not a custom domain or a
      # <org>.github.io root repo) serves from a /selaras/ subpath, not the
      # domain root - NUXT_APP_BASE_URL is Nuxt's own env-var mapping for
      # runtimeConfig.app.baseURL, so every generated link/asset path
      # accounts for it. Left unset for local `bun run docs:generate`, which
      # still defaults to `/`.
      - name: Generate static docs site
        run: bun run docs:generate
        env:
          NUXT_APP_BASE_URL: /selaras/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
