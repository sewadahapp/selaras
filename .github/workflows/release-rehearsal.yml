name: release rehearsal

on:
  workflow_dispatch:
    inputs:
      package:
        description: Packages to rehearse (version settings apply only to selected packages)
        type: choice
        default: selaras-and-docs
        options:
          - selaras-and-docs
          - all
          - selaras
          - selaras-docs
          - selaras-mcp
      selaras-version:
        description: Exact Selaras candidate version to validate
        type: string
        required: true
        default: 1.0.0
      docs-version:
        description: Exact docs layer candidate version to validate
        type: string
        required: true
        default: 0.1.0
      mcp-version:
        description: Exact MCP server candidate version to validate
        type: string
        required: true
        default: 0.1.0

jobs:
  rehearsal:
    runs-on: ubuntu-latest

    # This workflow deliberately has no write, package, Pages, or identity
    # permissions. It validates the release job's pre-publish path in an
    # ephemeral checkout and cannot publish, tag, push, deploy, or release.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Docs prepare
        run: bun run docs:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Create ephemeral release candidate
        run: |
          case "${{ inputs.package }}" in
            all|selaras-and-docs)
              npx changelogen --bump -r "${{ inputs.selaras-version }}"
              node scripts/bump-workspace-package.mjs --package docs --version "${{ inputs.docs-version }}"
              if [ "${{ inputs.package }}" = "all" ]; then
                node scripts/bump-workspace-package.mjs --package mcp --version "${{ inputs.mcp-version }}"
              fi
              ;;
            selaras)
              npx changelogen --bump -r "${{ inputs.selaras-version }}"
              ;;
            selaras-docs)
              node scripts/bump-workspace-package.mjs --package docs --version "${{ inputs.docs-version }}"
              ;;
            selaras-mcp)
              node scripts/bump-workspace-package.mjs --package mcp --version "${{ inputs.mcp-version }}"
              ;;
          esac

      - name: Add 1.0 migration summary
        if: (inputs.package == 'all' || inputs.package == 'selaras-and-docs' || inputs.package == 'selaras') && inputs.selaras-version == '1.0.0'
        run: node scripts/annotate-release-notes.mjs 1.0.0 .github/release-notes/1.0.0.md

      - name: Install Chromium for candidate validation
        run: bunx playwright install --with-deps chromium

      - name: Verify release candidate
        run: bun run test:release

      - name: Validate docs layer publish manifest
        if: (inputs.package == 'all' || inputs.package == 'selaras-and-docs' || inputs.package == 'selaras-docs')
        run: |
          node scripts/prepare-docs-layer-release.mjs --selaras "${{ inputs.selaras-version }}"
          node scripts/prepare-docs-layer-release.mjs --assert-publishable

      - name: Validate MCP server package
        if: inputs.package == 'all' || inputs.package == 'selaras-mcp'
        run: bun run prepack && bun run test:agent

      - name: Generate static docs site
        run: |
          bun run docs:generate
          bun run test:docs-seo
        env:
          NUXT_APP_BASE_URL: /
          NUXT_SITE_URL: https://selarasui.my.id
          NUXT_LLMS_DOMAIN: https://selarasui.my.id
