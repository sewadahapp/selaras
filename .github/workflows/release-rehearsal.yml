name: release rehearsal

on:
  workflow_dispatch:
    inputs:
      package:
        description: Auto-detect packages to rehearse, or override the selection
        type: choice
        default: auto
        options:
          - auto
          - selaras-and-docs
          - all
          - selaras
          - selaras-docs
          - selaras-mcp
      selaras-bump:
        description: Selaras bump (auto uses relevant conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      selaras-version:
        description: Exact Selaras version (must advance; overrides selaras-bump)
        required: false
        type: string
      docs-bump:
        description: Docs layer bump (auto uses relevant conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      docs-version:
        description: Exact docs layer version (must advance; overrides docs-bump)
        required: false
        type: string
      mcp-bump:
        description: MCP server bump (auto uses relevant conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      mcp-version:
        description: Exact MCP server version (must advance; overrides mcp-bump)
        required: false
        type: string

jobs:
  rehearsal:
    runs-on: ubuntu-latest

    # Candidate files exist only in this checkout. No publishing, git writes,
    # Pages deployment, or OIDC authentication is permitted here.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set release plan path
        run: echo "PLAN_FILE=$RUNNER_TEMP/selaras-release-plan.json" >> "$GITHUB_ENV"

      - name: Plan release
        id: plan
        env:
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/plan-release.mjs --output "$PLAN_FILE"

      - name: Save release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: ${{ env.PLAN_FILE }}

      - name: Docs prepare
        run: bun run docs:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Create release candidate
        if: steps.plan.outputs.has_packages == 'true'
        run: node scripts/apply-release-plan.mjs "$PLAN_FILE"

      - name: Install Chromium for release validation
        if: steps.plan.outputs.has_packages == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Verify release candidate
        if: steps.plan.outputs.has_packages == 'true'
        run: bun run test:release

      - name: Build
        if: steps.plan.outputs.has_packages == 'true'
        run: bun run prepack

      - name: Verify MCP server package
        if: steps.plan.outputs.mcp == 'true'
        run: bun run test:agent

      - name: Validate docs layer publish manifest
        if: steps.plan.outputs.docs == 'true'
        run: |
          node scripts/prepare-docs-layer-release.mjs
          node scripts/prepare-docs-layer-release.mjs --assert-publishable
          node scripts/prepare-docs-layer-release.mjs --restore

      - name: Generate static docs site
        run: |
          bun run docs:generate
          bun run test:docs-seo
        env:
          NUXT_APP_BASE_URL: /
          NUXT_SITE_URL: https://selarasui.my.id
          NUXT_LLMS_DOMAIN: https://selarasui.my.id
