name: release rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate version to validate
        type: string
        required: true
        default: 1.0.0

jobs:
  rehearsal:
    runs-on: ubuntu-latest

    # This workflow deliberately has no write, package, Pages, or identity
    # permissions. It validates the release job's pre-publish path in an
    # ephemeral checkout and cannot publish, tag, push, deploy, or release.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Playground prepare
        run: bun run dev:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Create ephemeral release candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npx changelogen --bump -r "$RELEASE_VERSION"

      - name: Add 1.0 migration summary
        if: inputs.version == '1.0.0'
        run: node scripts/annotate-release-notes.mjs 1.0.0 .github/release-notes/1.0.0.md

      - name: Install Chromium for candidate validation
        run: bunx playwright install --with-deps chromium

      - name: Verify release candidate
        run: bun run test:release

      - name: Generate static docs site
        run: bun run dev:generate
        env:
          NUXT_APP_BASE_URL: /selaras/
