name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: bun install

      - name: Validate commit messages
        env:
          COMMIT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$COMMIT_FROM" ] && [ "$COMMIT_FROM" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$COMMIT_FROM^{commit}" 2>/dev/null; then
            bun run commitlint --from "$COMMIT_FROM" --to "$COMMIT_TO" --verbose
          else
            bun run commitlint --last --verbose
          fi

      - name: Lint
        run: bun run lint

      - name: Docs prepare
        run: bun run docs:prepare

      - name: Typecheck
        run: bun run test:types

      - name: Test
        run: bun run test

      - name: Generate docs site
        run: |
          bun run docs:generate
          bun run test:docs-seo
        env:
          NUXT_APP_BASE_URL: /
          NUXT_SITE_URL: https://selarasui.my.id
          NUXT_LLMS_DOMAIN: https://selarasui.my.id

      - name: Build packages
        run: bun run prepack

      - name: Validate packaged agent support
        run: bun run test:agent

      - name: Validate docs layer publish manifest
        run: |
          node scripts/prepare-docs-layer-release.mjs
          node scripts/prepare-docs-layer-release.mjs --assert-publishable
          node scripts/prepare-docs-layer-release.mjs --restore
          git diff --exit-code -- packages/docs/package.json

      # CHANGELOG.md keeps release history, .notes/ is local scratch, and
      # test-packed-docs-layer.mjs intentionally asserts published files
      # contain no playground paths - everything else must not mention it.
      - name: No playground references
        run: |
          matches=$(rg -l "playground" --glob '!node_modules' --glob '!.nuxt' --glob '!.output' --glob '!bun.lock' --glob '!CHANGELOG.md' --glob '!.notes/**' --glob '!scripts/test-packed-docs-layer.mjs' . || true)
          if [ -n "$matches" ]; then
            echo "Stale playground references:"
            echo "$matches"
            exit 1
          fi

  node-compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24.11.0
          - 26.0.0

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and test packed consumers under Node
        run: node scripts/test-compatibility.mjs

  typescript-compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the TypeScript support floor
        run: bun add --exact typescript@5.9.3

      - name: Build and test packed consumers with TypeScript
        run: node scripts/test-compatibility.mjs
        env:
          SELARAS_TYPESCRIPT_VERSION: 5.9.3

  tailwind-compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tailwind-version:
          - 4.3.0
          - 4.3.3

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the Tailwind matrix row
        run: bun add --exact tailwindcss@${{ matrix.tailwind-version }} @tailwindcss/vite@${{ matrix.tailwind-version }} @tailwindcss/oxide@${{ matrix.tailwind-version }}

      - name: Build and test packed consumers with Tailwind
        run: node scripts/test-compatibility.mjs
        env:
          SELARAS_TAILWIND_VERSION: ${{ matrix.tailwind-version }}
