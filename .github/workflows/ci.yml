name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Playground prepare
        run: bun run dev:prepare

      - name: Typecheck
        run: bun run test:types

      - name: Test
        run: bun run test

  node-compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24.11.0
          - 26.0.0

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and test packed consumers under Node
        run: node scripts/test-compatibility.mjs

  typescript-compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the TypeScript support floor
        run: bun add --exact typescript@5.9.3

      - name: Build and test packed consumers with TypeScript
        run: node scripts/test-compatibility.mjs
        env:
          SELARAS_TYPESCRIPT_VERSION: 5.9.3

  tailwind-compatibility:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tailwind-version:
          - 4.3.0
          - 4.3.3

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the Tailwind matrix row
        run: bun add --exact tailwindcss@${{ matrix.tailwind-version }} @tailwindcss/vite@${{ matrix.tailwind-version }} @tailwindcss/oxide@${{ matrix.tailwind-version }}

      - name: Build and test packed consumers with Tailwind
        run: node scripts/test-compatibility.mjs
        env:
          SELARAS_TAILWIND_VERSION: ${{ matrix.tailwind-version }}
